# Durchblick relaunch. build.mjs inlines and minifies into dist/.
[build]
  command = "node scrollcraft/builds/durchblick/build.mjs"
  publish = "scrollcraft/builds/durchblick/dist"

# A preview for now: stay out of search engines until the real launch.
# Remove this block when the site moves to saifis-gebaeudereinigung.de.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
